<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&display=block">
<style>
  body{margin:0;width:1200px;height:630px;background:#8E1B1B;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;}
  .left{width:400px;display:flex;justify-content:center}
  .left img{width:220px}
  .rule{width:3px;height:420px;background:#fff;position:relative;border-radius:2px}
  .rule::before,.rule::after{content:"";position:absolute;left:-6px;width:11px;height:11px;border-radius:50%;background:#8E1B1B;border:3px solid #fff}
  .rule::before{top:-8px}.rule::after{bottom:-8px}
  .right{padding-left:64px}
  .wm{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:800;font-size:120px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
  .tag{font-size:34px;letter-spacing:.2em;text-transform:uppercase;margin:18px 0 36px;opacity:.9}
  .line{font-size:34px;line-height:1.4}
</style></head><body>
<div class="left"><img src="../logo.svg"></div>
<div class="rule"></div>
<div class="right">
  <div class="wm">Gaston</div>
  <div class="tag">Security Specialist</div>
  <div class="line">Access control · Door hardware · Locksmith<br>Memphis · North Mississippi · West Memphis<br><b>901-730-9691</b></div>
</div>
</body></html>
